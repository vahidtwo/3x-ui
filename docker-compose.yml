# Dokploy deployment. Web routing (panel :2053, subscription :2096) is defined in
# Dokploy's Domains tab; the REALITY inbound (:8443) is published as raw TCP.
services:
  3xui:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    expose:
      - "2053"
      - "2096"
    ports:
      - "8443:8443/tcp"
    volumes:
      - xui-data:/etc/x-ui
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
      XUI_SKIP_HSTS: "true"
      XUI_INIT_WEB_BASE_PATH: "/24ar6crmna4bdlo4y1/"
    networks:
      - dokploy-network

volumes:
  xui-data:

networks:
  dokploy-network:
    external: true

