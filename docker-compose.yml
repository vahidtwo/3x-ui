# Dokploy / Traefik: attach to external dokploy-network (create on the host if missing:
#   docker network create dokploy-network
# for local builds only — on Dokploy the network already exists as a Swarm overlay).
services:
  3xui:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    expose:
      - "2053"
    ports:
      - "8443:8443"
    volumes:
      - xui-data:/etc/x-ui
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
      XUI_SKIP_HSTS: "true"
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.3xui-vahidtwo-web.rule=Host(`3xui.vahidtwo.ir`)
      - traefik.http.routers.3xui-vahidtwo-web.entrypoints=web
      - traefik.http.routers.3xui-vahidtwo-web.service=3xui-vahidtwo
      - traefik.http.routers.3xui-vahidtwo-websecure.rule=Host(`3xui.vahidtwo.ir`)
      - traefik.http.routers.3xui-vahidtwo-websecure.entrypoints=websecure
      - traefik.http.routers.3xui-vahidtwo-websecure.tls.certresolver=letsencrypt
      - traefik.http.routers.3xui-vahidtwo-websecure.service=3xui-vahidtwo
      - traefik.http.services.3xui-vahidtwo.loadbalancer.server.port=2053

volumes:
  xui-data:

networks:
  dokploy-network:
    external: true
